<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WinStars — Telegram Web App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    /* СТИЛИ ОСТАЮТСЯ ПРЕЖНИМИ + ДОБАВЛЕНЫ ФИЛЬТРЫ */
    :root {
      --bg-dark: #09070f; --bg-card: #130f1e; --bg-card-hover: #1b162b;
      --border: rgba(157, 78, 221, 0.15); --accent: #9d4edd; --text-main: #f3f0f8;
      --text-muted: #8a819b; --green: #10b981; --red: #ef4444;
      --nav-height: 64px; --header-height: 60px; --radius: 16px;
    }
    .team-logo-img { width: 42px; height: 42px; border-radius: 50%; object-fit: contain; background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 4px; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-dark); color: var(--text-main); overflow: hidden; height: 100vh; width: 100vw; }
    .bg-noise { position: fixed; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.03; pointer-events: none; z-index: 999; }
    header { height: var(--header-height); background: rgba(19, 15, 30, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: fixed; top: 0; left: 0; right: 0; z-index: 100; }
    .brand { font-weight: 800; font-size: 1.1rem; background: linear-gradient(135deg, #fff 30%, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .balance-badge { background: var(--bg-card-hover); border: 1px solid var(--border); border-radius: 20px; padding: 6px 12px; font-weight: 700; font-size: 0.85rem; }
    main { position: absolute; top: var(--header-height); bottom: var(--nav-height); left: 0; right: 0; overflow-y: auto; padding: 16px; }
    
    /* ФИЛЬТРЫ */
    .filters-panel { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .mode-toggle { display: flex; background: var(--bg-card); padding: 4px; border-radius: 12px; border: 1px solid var(--border); }
    .mode-btn { flex: 1; text-align: center; padding: 8px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); border-radius: 8px; cursor: pointer; transition: 0.3s; }
    .mode-btn.active { background: var(--accent); color: #fff; }
    .league-select { width: 100%; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 12px; border-radius: 12px; font-family: inherit; font-size: 0.85rem; font-weight: 600; outline: none; appearance: none; }

    .match-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
    .match-header { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px; }
    .live-tag { color: var(--red); font-weight: 700; display: flex; align-items: center; gap: 4px; }
    .live-dot { width: 6px; height: 6px; background: var(--red); border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .teams-container { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin-bottom: 14px; }
    .team { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
    .team-logo { width: 42px; height: 42px; background: rgba(255,255,255,0.05); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; border: 1px solid var(--border); }
    .team-name { font-size: 0.85rem; font-weight: 600; }
    .score { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
    .odds-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .odd-btn { background: var(--bg-card-hover); border: 1px solid var(--border); border-radius: 10px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: background 0.3s; }
    .odd-name { font-size: 0.7rem; color: var(--text-muted); }
    .odd-val { font-size: 0.9rem; font-weight: 700; margin-top: 2px; }
    
    .tab-content { display: none; } .tab-content.active { display: block; }
    nav { height: var(--nav-height); background: rgba(19, 15, 30, 0.9); backdrop-filter: blur(16px); border-top: 1px solid var(--border); position: fixed; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: repeat(5, 1fr); z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text-muted); cursor: pointer; }
    .nav-item.active { color: var(--accent); } .nav-item span { font-size: 0.68rem; font-weight: 600; }
    .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    
    /* Остальные стили (чат, профиль, касса) оставляем как есть, они не меняются */
    .section-title { font-size: 0.9rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; font-weight: 700; }
    .input-group { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .input-group input { background: transparent; border: none; outline: none; color: #fff; width: 100%; font-family: inherit; }
    .btn-submit { background: linear-gradient(135deg, var(--accent), #7b2cbf); border: none; border-radius: 12px; padding: 12px; width: 100%; color: #fff; font-weight: 700; cursor: pointer; }
    .chat-container { display: flex; flex-direction: column; height: 100%; }
    .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 10px; }
    .chat-msg { display: flex; gap: 10px; align-items: flex-start; }
    .chat-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-card-hover); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.75rem; border: 1px solid var(--border); flex-shrink: 0; }
    .chat-bubble { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; border-top-left-radius: 2px; padding: 8px 12px; max-width: 80%; }
    .chat-user { font-size: 0.75rem; color: var(--accent); font-weight: 700; margin-bottom: 2px; }
    .chat-text { font-size: 0.85rem; line-height: 1.3; }
    .user-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .user-avatar-lg { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }
    .history-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <svg class="bg-noise"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#noise)"/></svg>
  <header>
    <div class="brand">WINSTARS</div>
    <div class="header-actions">
      <div class="balance-badge"><span id="header-balance">0 ★</span></div>
    </div>
  </header>

  <main>
    <div class="tab-content active" id="tab-events">
      <!-- НОВЫЕ ФИЛЬТРЫ -->
      <div class="filters-panel">
        <div class="mode-toggle">
          <div class="mode-btn active" id="btn-live" onclick="setMode('live')">Live</div>
          <div class="mode-btn" id="btn-upcoming" onclick="setMode('upcoming')">Скоро</div>
        </div>
        <select class="league-select" id="league-select" onchange="renderMatches()">
          <option value="all">Все лиги</option>
        </select>
      </div>
      
      <div id="matches-container">
        <div style="text-align:center; color:var(--text-muted); padding: 20px;">Загрузка матчей...</div>
      </div>
    </div>

    <div class="tab-content" id="tab-bets">
      <div class="section-title">Мои позиции</div>
      <div id="active-bets"></div>
    </div>

    <div class="tab-content" id="tab-chat" style="height: 100%;">
      <div class="chat-container">
        <div class="chat-messages" id="chat-box"></div>
        <div class="chat-input-area" style="display:flex; gap:8px; margin-top:auto;">
          <div class="input-group" style="margin-bottom: 0; flex:1;">
            <input type="text" id="chat-input" placeholder="Написать в чат...">
          </div>
          <button class="btn-submit" style="width: auto; padding: 0 16px;" onclick="sendChatMessage()">➤</button>
        </div>
      </div>
    </div>

    <div class="tab-content" id="tab-cashier">
      <div class="section-title">Пополнение (Telegram Stars)</div>
      <div class="input-group"><input type="number" placeholder="Количество звёзд..." id="deposit-amount"></div>
      <button class="btn-submit" style="margin-bottom: 24px;" onclick="handleTelegramInvoice()">Оплатить</button>
      <div class="section-title">Промокод</div>
      <div class="input-group"><input type="text" placeholder="Введите промокод..." id="cashier-promo"></div>
      <button class="btn-submit" onclick="applyPromo('cashier-promo')">Активировать</button>
    </div>

    <div class="tab-content" id="tab-profile">
      <div class="user-card">
        <img class="user-avatar-lg" id="profile-avatar" src="" alt="Avatar">
        <div class="user-info">
          <h3 id="profile-name">Игрок</h3>
          <p id="profile-username">@username</p>
        </div>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;">
        <div style="background:var(--bg-card); padding:12px; border-radius:12px; text-align:center;">
          <div style="font-size:1.1rem; font-weight:800; color:var(--accent);" id="stat-winrate">0%</div>
          <div style="font-size:0.75rem; color:var(--text-muted);">Винрейт</div>
        </div>
        <div style="background:var(--bg-card); padding:12px; border-radius:12px; text-align:center;">
          <div style="font-size:1.1rem; font-weight:800; color:var(--accent);" id="stat-count">0</div>
          <div style="font-size:0.75rem; color:var(--text-muted);">Всего ставок</div>
        </div>
      </div>
    </div>
  </main>

  <nav>
    <div class="nav-item active" onclick="switchTab(this, 'tab-events')"><svg class="icon" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"/></svg><span>События</span></div>
    <div class="nav-item" onclick="switchTab(this, 'tab-bets')"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>Ставки</span></div>
    <div class="nav-item" onclick="switchTab(this, 'tab-chat')"><svg class="icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Чат</span></div>
    <div class="nav-item" onclick="switchTab(this, 'tab-cashier')"><svg class="icon" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Касса</span></div>
    <div class="nav-item" onclick="switchTab(this, 'tab-profile')"><svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Профиль</span></div>
  </nav>

  <script>
    const API_BASE_URL = 'https://117n5o4nai.apps.bot-hosting.cloud'; // Ссылка на твой хостинг
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let currentUser = null;
    let ws = null;
    let allMatchesRaw = []; 
    let currentMode = 'live'; // live | upcoming
    let currentLeague = 'all';
    let previousOdds = {}; 

    // Приоритет лиг для сортировки
    const LEAGUE_PRIORITY = {
      "Английская Премьер-лига": 1, "Испанская Ла Лига": 2, "Итальянская Серия А": 3, 
      "Немецкая Бундеслига": 4, "Французская Лига 1": 5, "РПЛ": 6, 
      "MLS": 7, "Саудовская Про-лига": 8
    };

    const tgUser = tg?.initDataUnsafe?.user;
    if (tgUser) {
      document.getElementById("profile-name").innerText = tgUser.first_name || "Игрок";
      document.getElementById("profile-username").innerText = "@" + (tgUser.username || "user");
    }

    async function initApp() {
      try {
        const initData = tg?.initData || "";
        const res = await fetch(`${API_BASE_URL}/api/user/sync?initData=${encodeURIComponent(initData)}`);
        const data = await res.json();
        if (data.status === "ok") {
          currentUser = data.user;
          updateUI();
          loadUserBets();
          initWebSocket();
          loadMatches();
          setInterval(loadMatches, 15000); // Автообновление каждые 15 сек
        }
      } catch (err) { console.error("Ошибка:", err); }
    }

    async function loadMatches() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/matches`);
        const data = await res.json();
        if (data.matches) {
          // Превращаем объект в массив и фильтруем мусор
          allMatchesRaw = Object.entries(data.matches)
            .filter(([id, m]) => id !== 'match_fb_1' && m.odds) 
            .map(([id, m]) => ({ id, ...m }));
            
          updateLeagueDropdown();
          renderMatches();
        }
      } catch (e) { console.error("Ошибка загрузки матчей:", e); }
    }

    // Заполняем выпадающий список лиг (сначала ТОП)
    function updateLeagueDropdown() {
      const leagues = new Set(allMatchesRaw.map(m => m.league || 'Футбол'));
      const sortedLeagues = Array.from(leagues).sort((a, b) => {
        const prioA = LEAGUE_PRIORITY[a] || 99;
        const prioB = LEAGUE_PRIORITY[b] || 99;
        if (prioA !== prioB) return prioA - prioB;
        return a.localeCompare(b);
      });

      const select = document.getElementById('league-select');
      const currentVal = select.value;
      select.innerHTML = '<option value="all">Все лиги</option>';
      sortedLeagues.forEach(l => {
        select.innerHTML += `<option value="${l}">${l}</option>`;
      });
      select.value = currentVal || 'all';
      currentLeague = select.value;
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-live').classList.toggle('active', mode === 'live');
      document.getElementById('btn-upcoming').classList.toggle('active', mode === 'upcoming');
      renderMatches();
    }

    function renderMatches() {
      currentLeague = document.getElementById('league-select').value;
      const container = document.getElementById('matches-container');
      container.innerHTML = '';

      // ФИЛЬТРАЦИЯ
      let filtered = allMatchesRaw.filter(m => {
        const isLive = m.status.includes('LIVE');
        const modeMatch = currentMode === 'live' ? isLive : !isLive;
        const leagueMatch = currentLeague === 'all' || m.league === currentLeague;
        return modeMatch && leagueMatch;
      });

      // СОРТИРОВКА
      filtered.sort((a, b) => {
        const prioA = LEAGUE_PRIORITY[a.league] || 99;
        const prioB = LEAGUE_PRIORITY[b.league] || 99;
        if (prioA !== prioB) return prioA - prioB;
        return (a.start_time || 0) - (b.start_time || 0);
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding: 20px;">Матчей не найдено</div>';
        return;
      }

      filtered.forEach(match => {
        const isLive = match.status.includes('LIVE');
        const card = document.createElement('div');
        card.className = 'match-card';
        
        // СТРОГИЙ ПОРЯДОК КЭФОВ: П1 | Х | П2
        const oddsOrder = ['1', 'X', '2'];
        const outcomeNames = { "1": "П1", "X": "Х", "2": "П2" };
        let oddsHtml = '';
        
        oddsOrder.forEach(outcome => {
          const coeff = match.odds[outcome];
          if (!coeff) return;
          
          const oldCoeff = previousOdds[`${match.id}_${outcome}`];
          let highlightStyle = '';
          if (oldCoeff && oldCoeff !== coeff) {
            highlightStyle = coeff > oldCoeff ? 'background: rgba(16, 185, 129, 0.2);' : 'background: rgba(239, 68, 68, 0.2);';
          }
          previousOdds[`${match.id}_${outcome}`] = coeff;

          oddsHtml += `
            <div class="odd-btn" style="${highlightStyle}" onclick="placeBetPrompt('${match.id}', '${match.title}', '${outcomeNames[outcome]}', ${coeff})">
              <span class="odd-name">${outcomeNames[outcome]}</span>
              <span class="odd-val">${coeff}</span>
            </div>
          `;
        });

        const homeName = match.home || 'Хозяева';
        const awayName = match.away || 'Гости';
        
        // referrerpolicy="no-referrer" ОБХОДИТ ЗАЩИТУ ФОНБЕТА
        const homeLogoHtml = match.homeLogo 
          ? `<img src="${match.homeLogo}" referrerpolicy="no-referrer" class="team-logo-img" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="team-logo" style="display:none">${homeName.substring(0,2).toUpperCase()}</div>`
          : `<div class="team-logo">${homeName.substring(0,2).toUpperCase()}</div>`;
          
        const awayLogoHtml = match.awayLogo 
          ? `<img src="${match.awayLogo}" referrerpolicy="no-referrer" class="team-logo-img" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="team-logo" style="display:none">${awayName.substring(0,2).toUpperCase()}</div>`
          : `<div class="team-logo">${awayName.substring(0,2).toUpperCase()}</div>`;

        card.innerHTML = `
          <div class="match-header">
            ${isLive ? `<span class="live-tag"><div class="live-dot"></div> ${match.status}</span>` : `<span>${match.status}</span>`}
            <span>${match.league || 'Футбол'}</span>
          </div>
          <div class="teams-container">
            <div class="team">
              ${homeLogoHtml}
              <div class="team-name">${homeName}</div>
            </div>
            <div class="score">${match.score || 'VS'}</div>
            <div class="team">
              ${awayLogoHtml}
              <div class="team-name">${awayName}</div>
            </div>
          </div>
          <div class="odds-grid">${oddsHtml}</div>
        `;
        container.appendChild(card);
      });
    }

    // ... ОСТАЛЬНЫЕ ФУНКЦИИ (placeBetPrompt, updateUI, чат) ОСТАЮТСЯ БЕЗ ИЗМЕНЕНИЙ ...
    
    async function placeBetPrompt(matchId, matchTitle, outcome, coeff) {
      const amountStr = prompt(`Ставка на "${outcome}" (${coeff})\nВведите сумму в звездах (★):`, "50");
      if (!amountStr) return;
      const amount = parseInt(amountStr);
      if (isNaN(amount) || amount <= 0) return alert("Введите корректную сумму");
      try {
        const res = await fetch(`${API_BASE_URL}/api/bets/place`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: currentUser.user_id, match_id: matchId, match_title: matchTitle, outcome, coefficient: coeff, amount })
        });
        const data = await res.json();
        if (res.ok) {
          currentUser.balance = data.new_balance;
          currentUser.total_bets += 1;
          updateUI(); loadUserBets(); alert(data.message);
        } else { alert(data.detail || "Ошибка"); }
      } catch (err) { alert("Ошибка соединения"); }
    }

    function updateUI() {
      if (!currentUser) return;
      document.getElementById("header-balance").innerText = `${currentUser.balance} ★`;
      document.getElementById("profile-name").innerText = currentUser.first_name;
      document.getElementById("profile-username").innerText = "@" + (currentUser.username || "user");
      document.getElementById("stat-winrate").innerText = `${Math.round((currentUser.wins / (currentUser.total_bets || 1)) * 100)}%`;
      document.getElementById("stat-count").innerText = currentUser.total_bets;
      if (currentUser.photo_url) document.getElementById("profile-avatar").src = currentUser.photo_url;
    }

    async function loadUserBets() {
      if (!currentUser) return;
      try {
        const res = await fetch(`${API_BASE_URL}/api/user/bets?user_id=${currentUser.user_id}`);
        const data = await res.json();
        const container = document.getElementById('active-bets');
        container.innerHTML = '';
        if (!data.bets || data.bets.length === 0) {
          container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:20px;">Нет ставок</div>';
          return;
        }
        data.bets.forEach(bet => {
          container.innerHTML += `
            <div class="history-card">
              <div><div style="font-weight:700;">${bet.match_title}</div><div style="font-size:0.75rem; color:var(--text-muted);">${bet.outcome} @ ${bet.coefficient}</div></div>
              <div style="text-align:right;"><div style="font-weight:800; color:var(--accent);">${bet.amount} ★</div></div>
            </div>`;
        });
      } catch (e) {}
    }

    function switchTab(el, tabId) {
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      el.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    document.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
