<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WinStars</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    :root { --bg-dark: #09070f; --bg-card: #130f1e; --bg-card-hover: #1b162b; --border: rgba(157, 78, 221, 0.15); --accent: #9d4edd; --text-main: #f3f0f8; --text-muted: #8a819b; --green: #10b981; --red: #ef4444; --nav-height: 64px; --header-height: 60px; --radius: 16px; }
    .team-logo-img { width: 42px; height: 42px; border-radius: 50%; object-fit: contain; background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 4px; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-dark); color: var(--text-main); overflow: hidden; height: 100vh; width: 100vw; }
    .bg-noise { position: fixed; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.03; pointer-events: none; z-index: 999; }
    
    header { height: var(--header-height); background: rgba(19, 15, 30, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: fixed; top: 0; left: 0; right: 0; z-index: 100; }
    .brand { font-weight: 800; font-size: 1.1rem; letter-spacing: 0.5px; background: linear-gradient(135deg, #fff 30%, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .balance-badge { background: var(--bg-card-hover); border: 1px solid var(--border); border-radius: 20px; padding: 6px 12px; display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 0.85rem; }
    .avatar-btn { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--accent); overflow: hidden; cursor: pointer; }
    .avatar-btn img { width: 100%; height: 100%; object-fit: cover; }
    
    main { position: absolute; top: var(--header-height); bottom: var(--nav-height); left: 0; right: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; }
    .tab-content { display: none; opacity: 0; }
    .tab-content.active { display: block; opacity: 1; }
    
    .filters-panel { display: flex; gap: 10px; margin-bottom: 16px; }
    .mode-toggle { display: flex; flex: 1; background: var(--bg-card); padding: 4px; border-radius: 12px; border: 1px solid var(--border); }
    .mode-btn { flex: 1; text-align: center; padding: 8px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); border-radius: 8px; cursor: pointer; transition: 0.3s; }
    .mode-btn.active { background: var(--accent); color: #fff; }
    
    .league-filter-btn { display: flex; align-items: center; justify-content: space-between; background: var(--bg-card); border: 1px solid var(--border); padding: 0 16px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; color: var(--text-main); cursor: pointer; width: 45%; }
    .league-filter-btn span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 500; display: none; opacity: 0; transition: opacity 0.3s; backdrop-filter: blur(4px); }
    .modal-overlay.open { display: block; opacity: 1; }
    .modal-content { position: absolute; bottom: -100%; left: 0; right: 0; background: var(--bg-card); border-radius: 24px 24px 0 0; padding: 20px; max-height: 80vh; display: flex; flex-direction: column; transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-top: 1px solid var(--border); }
    .modal-overlay.open .modal-content { bottom: 0; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-weight: 800; font-size: 1.1rem; }
    .modal-close { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
    .league-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 20px; }
    .league-item { padding: 14px 16px; background: var(--bg-card-hover); border: 1px solid transparent; border-radius: 12px; font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .league-item.active { border-color: var(--accent); background: rgba(157, 78, 221, 0.15); color: var(--accent); }
    .league-item .league-top { color: var(--accent); font-size: 0.7rem; background: rgba(157, 78, 221, 0.2); padding: 2px 6px; border-radius: 6px; margin-left: 8px; }

    .section-title { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 12px; font-weight: 700; }
    .match-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
    .match-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px; }
    .live-tag { color: var(--red); font-weight: 700; display: flex; align-items: center; gap: 4px; }
    .live-dot { width: 6px; height: 6px; background: var(--red); border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .teams-container { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin-bottom: 14px; }
    .team { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
    .team-logo { width: 42px; height: 42px; background: rgba(255,255,255,0.05); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; border: 1px solid var(--border); font-size: 0.8rem; }
    .team-name { font-size: 0.85rem; font-weight: 600; }
    .score { font-size: 1.4rem; font-weight: 800; letter-spacing: 2px; color: var(--accent); }
    .odds-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .odd-btn { background: var(--bg-card-hover); border: 1px solid var(--border); border-radius: 10px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: background 0.3s; }
    .odd-name { font-size: 0.7rem; color: var(--text-muted); }
    .odd-val { font-size: 0.9rem; font-weight: 700; margin-top: 2px; }

    .pill-tabs { display: flex; background: var(--bg-card); padding: 4px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 16px; }
    .pill-tab { flex: 1; text-align: center; padding: 8px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); border-radius: 8px; cursor: pointer; }
    .pill-tab.active { background: var(--accent); color: #fff; }
    .chart-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
    .chart-val { font-size: 1.8rem; font-weight: 800; margin: 4px 0 12px 0; }
    .chart-val.negative { color: var(--red); } .chart-val.positive { color: var(--green); } .chart-val.neutral { color: #8a819b; }
    .svg-chart { width: 100%; height: 120px; overflow: visible; }
    
    .input-group { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .input-group input { background: transparent; border: none; outline: none; color: #fff; font-family: inherit; font-size: 0.95rem; width: 100%; }
    .btn-submit { background: linear-gradient(135deg, var(--accent), #7b2cbf); border: none; border-radius: 12px; padding: 12px; width: 100%; color: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer; }
    .btn-submit:active { transform: scale(0.98); }
    
    .chat-container { display: flex; flex-direction: column; height: 100%; }
    .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 10px; }
    .chat-msg { display: flex; gap: 10px; align-items: flex-start; }
    .chat-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-card-hover); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.75rem; border: 1px solid var(--border); flex-shrink: 0; }
    .chat-bubble { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; border-top-left-radius: 2px; padding: 8px 12px; max-width: 80%; }
    .chat-user { font-size: 0.75rem; color: var(--accent); font-weight: 700; margin-bottom: 2px; }
    .chat-text { font-size: 0.85rem; line-height: 1.3; }
    .chat-input-area { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; }
    
    .user-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .user-avatar-lg { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }
    .user-info h3 { font-size: 1.05rem; font-weight: 700; } .user-info p { font-size: 0.8rem; color: var(--text-muted); }
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
    .stat-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; }
    .stat-val { font-size: 1.1rem; font-weight: 800; color: var(--accent); }
    .stat-lbl { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
    
    nav { height: var(--nav-height); background: rgba(19, 15, 30, 0.9); backdrop-filter: blur(16px); border-top: 1px solid var(--border); position: fixed; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: repeat(5, 1fr); z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text-muted); cursor: pointer; }
    .nav-item.active { color: var(--accent); } .nav-item span { font-size: 0.68rem; font-weight: 600; }
    .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    
    .menu-drawer { position: fixed; top: 0; right: -100%; width: 260px; height: 100%; background: var(--bg-card); border-left: 1px solid var(--border); z-index: 200; padding: 24px 16px; transition: right 0.3s; }
    .menu-drawer.open { right: 0; } .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 199; display: none; } .drawer-overlay.open { display: block; }
    .drawer-menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    .history-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <svg class="bg-noise"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#noise)"/></svg>
  
  <header>
    <div class="brand">WINSTARS</div>
    <div class="header-actions">
      <div class="balance-badge"><svg class="icon" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span id="header-balance">0 ★</span></div>
      <div class="avatar-btn" id="avatar-trigger"><img id="user-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Default" alt="Avatar"></div>
    </div>
  </header>

  <main>
    <div class="tab-content active" id="tab-events">
      <div class="filters-panel">
        <div class="mode-toggle">
          <div class="mode-btn active" id="btn-live" onclick="setMode('live')">Live</div>
          <div class="mode-btn" id="btn-upcoming" onclick="setMode('upcoming')">Скоро</div>
        </div>
        <button class="league-filter-btn" onclick="openLeagueModal()">
          <span id="selected-league-text">Все лиги</span>
          <svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px;"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
      
      <div id="matches-container"><div style="text-align:center; color:var(--text-muted); padding: 20px;">Загрузка матчей...</div></div>
    </div>

    <div class="tab-content" id="tab-bets">
      <div class="pill-tabs">
        <div class="pill-tab active" onclick="switchBetSubTab(this, 'active-bets')">Позиции</div>
        <div class="pill-tab" onclick="switchBetSubTab(this, 'history-bets')">История</div>
      </div>
      <div id="active-bets"></div>
      <div id="history-bets" style="display: none;"><div id="history-list"></div></div>
    </div>

    <div class="tab-content" id="tab-chat" style="height: 100%;">
      <div class="chat-container">
        <div class="chat-messages" id="chat-box"></div>
        <div class="chat-input-area">
          <div class="input-group" style="margin-bottom: 0;"><input type="text" id="chat-input" placeholder="Написать в чат..."></div>
          <button class="btn-submit" style="width: auto; padding: 0 16px;" onclick="sendChatMessage()"><svg class="icon" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
        </div>
      </div>
    </div>

    <div class="tab-content" id="tab-cashier">
      <div class="section-title">Пополнение звёзд (Telegram Stars)</div>
      <div class="input-group"><svg class="icon" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><input type="number" placeholder="Количество звёзд..." id="deposit-amount"></div>
      <button class="btn-submit" style="margin-bottom: 24px;" onclick="handleTelegramInvoice()">Оплатить через Stars</button>
      <div class="section-title">Активация промокода</div>
      <div class="input-group"><svg class="icon" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82zM7 7h.01"/></svg><input type="text" placeholder="Введите промокод..." id="cashier-promo"></div>
      <button class="btn-submit" onclick="applyPromo('cashier-promo')">Применить</button>
    </div>

    <div class="tab-content" id="tab-profile">
      <div class="user-card">
        <img class="user-avatar-lg" id="profile-avatar" src="" alt="Avatar">
        <div class="user-info"><h3 id="profile-name">Игрок</h3><p id="profile-username">@username</p></div>
      </div>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-val" id="stat-winrate">0%</div><div class="stat-lbl">Винрейт</div></div>
        <div class="stat-box"><div class="stat-val" id="stat-count">0</div><div class="stat-lbl">Всего ставок</div></div>
      </div>
      <div class="chart-card">
        <div class="section-title" style="margin: 0;">Прибыль</div>
        <div class="chart-val neutral" id="chart-total">0 ★</div>
        <svg class="svg-chart" viewBox="0 0 300 100" preserveAspectRatio="none">
          <path id="chart-fill" d="M 0,50 L 300,50 L 300,100 L 0,100 Z" fill="rgba(138, 129, 155, 0.2)" />
          <path id="chart-path" d="M 0,50 L 300,50" fill="none" stroke="#8a819b" stroke-width="3" stroke-linecap="round" />
        </svg>
      </div>
      <div class="section-title">Ввод промокода</div>
      <div class="input-group"><svg class="icon" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82zM7 7h.01"/></svg><input type="text" placeholder="Промокод..." id="profile-promo"></div>
      <button class="btn-submit" onclick="applyPromo('profile-promo')">Активировать</button>
    </div>
  </main>

  <nav>
    <div class="nav-item active" onclick="switchTab(this, 'tab-events')"><svg class="icon" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"/></svg><span>События</span></div>
    <div class="nav-item" onclick="switchTab(this, 'tab-bets')"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>Ставки</span></div>
    <div class="nav-item" onclick="switchTab(this, 'tab-chat')"><svg class="icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Чат</span></div>
    <div class="nav-item" onclick="switchTab(this, 'tab-cashier')"><svg class="icon" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Касса</span></div>
    <div class="nav-item" onclick="switchTab(this, 'tab-profile')"><svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Профиль</span></div>
  </nav>

  <div class="modal-overlay" id="league-modal" onclick="closeLeagueModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        Выбор лиги
        <button class="modal-close" onclick="closeLeagueModal()">✕</button>
      </div>
      <div class="league-list" id="league-list-container"></div>
    </div>
  </div>

  <div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>
  <div class="menu-drawer" id="drawer">
    <div class="drawer-menu-item" onclick="switchTabDirect('tab-bets')">Мои ставки</div>
    <div class="drawer-menu-item">Поддержка</div>
  </div>

  <script>
    const API_BASE_URL = 'https://117n5o4nai.apps.bot-hosting.cloud';
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let currentUser = null; 
    let ws = null; 
    let allMatchesRaw = []; 
    let currentMode = 'live'; 
    let currentLeague = 'all'; 
    let previousOdds = {}; 

    const LEAGUE_PRIORITY = {
      "АПЛ": 1, "Ла Лига": 2, "Серия А": 3, "Бундеслига": 4, "Лига 1": 5,
      "РПЛ": 6, "Лига Чемпионов": 7, "Лига Европы": 8, "Лига Конференций": 9,
      "ФНЛ": 10, "Саудовская Аравия": 11, "Эредивизи": 12, "MLS": 13,
      "Примейра": 14, "Чемпионшип": 15, "Ла Лига 2": 16, "ЧМ": 17, "ЧЕ": 18, "Лига Наций": 19
    };

    const tgUser = tg?.initDataUnsafe?.user;
    if (tgUser) {
      document.getElementById("profile-name").innerText = tgUser.first_name || "Игрок";
      document.getElementById("profile-username").innerText = "@" + (tgUser.username || "user");
      if (tgUser.photo_url) {
        document.getElementById("user-avatar").src = tgUser.photo_url;
        document.getElementById("profile-avatar").src = tgUser.photo_url;
      }
    }

    async function initApp() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/user/sync?initData=${encodeURIComponent(tg?.initData || "")}`);
        const data = await res.json();
        if (data.status === "ok") {
          currentUser = data.user; 
          updateUI(); 
          loadUserBets(); 
          initWebSocket(); 
          loadMatches();
          setInterval(loadMatches, 15000); 
        }
      } catch (err) { console.error("Ошибка синхронизации:", err); }
    }

    async function loadMatches() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/matches`);
        const data = await res.json();
        if (data.matches) {
          allMatchesRaw = Object.entries(data.matches).filter(([id, m]) => id !== 'match_fb_1' && m.odds).map(([id, m]) => ({ id, ...m }));
          updateLeagueList(); 
          renderMatches();
        }
      } catch (e) { console.error("Ошибка загрузки матчей:", e); }
    }

    function updateLeagueList() {
      const leagues = new Set(allMatchesRaw.map(m => m.league || 'Футбол'));
      const sortedLeagues = Array.from(leagues).sort((a, b) => {
        const prioA = LEAGUE_PRIORITY[a] || 999;
        const prioB = LEAGUE_PRIORITY[b] || 999;
        if (prioA !== prioB) return prioA - prioB;
        return a.localeCompare(b);
      });

      const container = document.getElementById('league-list-container');
      container.innerHTML = `<div class="league-item ${currentLeague === 'all' ? 'active' : ''}" onclick="selectLeague('all')">Все лиги</div>`;
      
      sortedLeagues.forEach(l => {
        const isTop = LEAGUE_PRIORITY[l] <= 13 ? '<span class="league-top">ТОП</span>' : '';
        container.innerHTML += `<div class="league-item ${currentLeague === l ? 'active' : ''}" onclick="selectLeague('${l}')">${l} ${isTop}</div>`;
      });
    }

    function openLeagueModal() { document.getElementById('league-modal').classList.add('open'); }
    function closeLeagueModal(e) { if (!e || e.target === document.getElementById('league-modal') || e.target.tagName === 'BUTTON') document.getElementById('league-modal').classList.remove('open'); }
    
    function selectLeague(league) {
      currentLeague = league;
      document.getElementById('selected-league-text').innerText = league === 'all' ? 'Все лиги' : league;
      closeLeagueModal();
      renderMatches();
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-live').classList.toggle('active', mode === 'live');
      document.getElementById('btn-upcoming').classList.toggle('active', mode === 'upcoming');
      renderMatches();
    }

    function renderMatches() {
      const container = document.getElementById('matches-container');
      container.innerHTML = '';
      
      let filtered = allMatchesRaw.filter(m => {
        const isLive = m.status.includes('LIVE');
        const modeMatch = currentMode === 'live' ? isLive : !isLive;
        return modeMatch && (currentLeague === 'all' || m.league === currentLeague);
      });
      
      filtered.sort((a, b) => {
        const prioA = LEAGUE_PRIORITY[a.league] || 999;
        const prioB = LEAGUE_PRIORITY[b.league] || 999;
        if (prioA !== prioB) return prioA - prioB;
        return (a.start_time || 0) - (b.start_time || 0);
      });

      if (filtered.length === 0) { 
        container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding: 20px;">Матчей не найдено</div>'; 
        return; 
      }

      filtered.forEach(match => {
        const isLive = match.status.includes('LIVE');
        const card = document.createElement('div'); card.className = 'match-card';
        
        let timeDisplay = match.status;
        if (!isLive && match.start_time) {
          const date = new Date(match.start_time * 1000);
          const day = String(date.getDate()).padStart(2, '0');
          const month = String(date.getMonth() + 1).padStart(2, '0');
          const hours = String(date.getHours()).padStart(2, '0');
          const minutes = String(date.getMinutes()).padStart(2, '0');
          timeDisplay = `${day}.${month} ${hours}:${minutes}`;
        }

        const oddsOrder = ['1', 'X', '2']; const outcomeNames = { "1": "П1", "X": "Х", "2": "П2" };
        let oddsHtml = '';
        
        oddsOrder.forEach(outcome => {
          const coeff = match.odds[outcome]; if (!coeff) return;
          const oldCoeff = previousOdds[`${match.id}_${outcome}`];
          let highlightStyle = (oldCoeff && oldCoeff !== coeff) ? (coeff > oldCoeff ? 'background: rgba(16, 185, 129, 0.2);' : 'background: rgba(239, 68, 68, 0.2);') : '';
          previousOdds[`${match.id}_${outcome}`] = coeff;
          oddsHtml += `<div class="odd-btn" style="${highlightStyle}" onclick="placeBetPrompt('${match.id}', '${match.title}', '${outcomeNames[outcome]}', ${coeff})"><span class="odd-name">${outcomeNames[outcome]}</span><span class="odd-val">${coeff}</span></div>`;
        });

        const homeName = match.home || 'Хозяева'; 
        const awayName = match.away || 'Гости';
        
        // ЗАГРУЗКА ЛОГОТИПОВ ЧЕРЕЗ НАШ СЕРВЕР
        const homeLogoProxy = match.homeLogo ? `${API_BASE_URL}/api/proxy-image?url=${encodeURIComponent(match.homeLogo)}` : '';
        const awayLogoProxy = match.awayLogo ? `${API_BASE_URL}/api/proxy-image?url=${encodeURIComponent(match.awayLogo)}` : '';

        const homeLogoHtml = match.homeLogo 
          ? `<img src="${homeLogoProxy}" class="team-logo-img" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="team-logo" style="display:none">${homeName.substring(0,2).toUpperCase()}</div>` 
          : `<div class="team-logo">${homeName.substring(0,2).toUpperCase()}</div>`;
          
        const awayLogoHtml = match.awayLogo 
          ? `<img src="${awayLogoProxy}" class="team-logo-img" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="team-logo" style="display:none">${awayName.substring(0,2).toUpperCase()}</div>` 
          : `<div class="team-logo">${awayName.substring(0,2).toUpperCase()}</div>`;

        card.innerHTML = `
          <div class="match-header">
            ${isLive ? `<span class="live-tag"><div class="live-dot"></div> ${match.status}</span>` : `<span>${timeDisplay}</span>`}
            <span>${match.league || 'Футбол'}</span>
          </div>
          <div class="teams-container">
            <div class="team">${homeLogoHtml}<div class="team-name">${homeName}</div></div>
            <div class="score">${match.score || 'VS'}</div>
            <div class="team">${awayLogoHtml}<div class="team-name">${awayName}</div></div>
          </div>
          <div class="odds-grid">${oddsHtml}</div>`;
        container.appendChild(card);
      });
    }

    async function placeBetPrompt(matchId, matchTitle, outcome, coeff) {
      const amountStr = prompt(`Ставка на "${outcome}" (${coeff})\nВведите сумму в звездах (★):`, "50");
      if (!amountStr) return;
      const amount = parseInt(amountStr);
      if (isNaN(amount) || amount <= 0) return alert("Введите корректную сумму");
      try {
        const res = await fetch(`${API_BASE_URL}/api/bets/place`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: currentUser.user_id, match_id: matchId, match_title: matchTitle, outcome, coefficient: coeff, amount })
        });
        const data = await res.json();
        if (res.ok) { currentUser.balance = data.new_balance; currentUser.total_bets += 1; updateUI(); loadUserBets(); alert(data.message); } else { alert(data.detail || "Ошибка"); }
      } catch (err) { alert("Ошибка соединения"); }
    }

    async function handleTelegramInvoice() {
      const amount = parseInt(document.getElementById('deposit-amount').value);
      if (!amount || amount <= 0) return alert("Введите корректную сумму");
      try {
        const res = await fetch(`${API_BASE_URL}/api/cashier/invoice`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: currentUser.user_id, amount: amount })
        });
        const data = await res.json();
        if (res.ok && data.invoice_link) {
          if (tg && tg.openInvoice) {
            tg.openInvoice(data.invoice_link, async (status) => { if (status === "paid") { alert("Оплата успешна!"); setTimeout(() => location.reload(), 2000); } });
          } else { window.open(data.invoice_link, '_blank'); }
        } else { alert(data.detail || "Ошибка инвойса"); }
      } catch (e) { alert("Ошибка соединения с платежным шлюзом"); }
    }

    function initWebSocket() {
      const wsUrl = API_BASE_URL.replace('https://', 'wss://').replace('http://', 'ws://') + '/ws/chat';
      ws = new WebSocket(wsUrl);
      ws.onmessage = (event) => { const msg = JSON.parse(event.data); appendChatMessage(msg.first_name, msg.text); };
      ws.onclose = () => setTimeout(initWebSocket, 3000); 
      fetch(`${API_BASE_URL}/api/chat/history`).then(r => r.json()).then(data => {
        const chatBox = document.getElementById('chat-box'); chatBox.innerHTML = '';
        if (data.messages) data.messages.forEach(m => appendChatMessage(m.first_name, m.text));
      }).catch(() => {});
    }

    function appendChatMessage(name, text) {
      const chatBox = document.getElementById('chat-box');
      const msgDiv = document.createElement('div'); msgDiv.className = 'chat-msg';
      msgDiv.innerHTML = `<div class="chat-avatar">${name.substring(0, 2).toUpperCase()}</div><div class="chat-bubble"><div class="chat-user">${name}</div><div class="chat-text">${text}</div></div>`;
      chatBox.appendChild(msgDiv); chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendChatMessage() {
      const input = document.getElementById('chat-input'); const text = input.value.trim();
      if (!text || !currentUser || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ user_id: currentUser.user_id, first_name: currentUser.first_name, text: text })); input.value = '';
    }

    async function applyPromo(inputId) {
      const code = document.getElementById(inputId).value.trim();
      if (!code || !currentUser) return;
      try {
        const res = await fetch(`${API_BASE_URL}/api/cashier/promo`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: currentUser.user_id, code: code })
        });
        const data = await res.json();
        if (res.ok) { currentUser.balance = data.new_balance; updateUI(); alert(data.message); document.getElementById(inputId).value = ''; } else { alert(data.detail || "Ошибка"); }
      } catch (err) { alert("Ошибка соединения"); }
    }

    async function loadUserBets() {
      if (!currentUser) return;
      try {
        const res = await fetch(`${API_BASE_URL}/api/user/bets?user_id=${currentUser.user_id}`);
        const data = await res.json();
        const container = document.getElementById('active-bets'); container.innerHTML = '';
        const historyContainer = document.getElementById('history-list'); historyContainer.innerHTML = '';
        
        if (!data.bets || data.bets.length === 0) {
          container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:20px;">Нет ставок</div>';
          historyContainer.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:20px;">История пуста</div>';
          return;
        }
        
        data.bets.forEach(bet => {
          const isActive = bet.status === 'active';
          const html = `<div class="history-card"><div><div style="font-weight:700;">${bet.match_title}</div><div style="font-size:0.75rem; color:var(--text-muted);">${bet.outcome} @ ${bet.coefficient}</div></div><div style="text-align:right;"><div style="font-weight:800; color:var(--accent);">${bet.amount} ★</div></div></div>`;
          if (isActive) { container.innerHTML += html; } else { historyContainer.innerHTML += html; }
        });
        
        if (container.innerHTML === '') container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:20px;">Нет активных позиций</div>';
        if (historyContainer.innerHTML === '') historyContainer.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:20px;">История пуста</div>';
      } catch (err) {}
    }

    function updateUI() {
      if (!currentUser) return;
      document.getElementById("header-balance").innerText = `${currentUser.balance} ★`;
      document.getElementById("profile-name").innerText = currentUser.first_name;
      document.getElementById("profile-username").innerText = "@" + (currentUser.username || "user");
      document.getElementById("stat-winrate").innerText = `${Math.round((currentUser.wins / (currentUser.total_bets || 1)) * 100)}%`;
      document.getElementById("stat-count").innerText = currentUser.total_bets;
      if (currentUser.photo_url) { document.getElementById("user-avatar").src = currentUser.photo_url; document.getElementById("profile-avatar").src = currentUser.photo_url; }
      
      const profitEl = document.getElementById("chart-total"); const profit = currentUser.profit || 0;
      profitEl.innerText = `${profit > 0 ? '+' : ''}${profit} ★`;
      const chartPath = document.getElementById("chart-path"); const chartFill = document.getElementById("chart-fill");
      if (profit > 0) { profitEl.className = "chart-val positive"; chartPath.setAttribute("stroke", "#10b981"); chartFill.setAttribute("fill", "rgba(16, 185, 129, 0.2)"); }
      else if (profit < 0) { profitEl.className = "chart-val negative"; chartPath.setAttribute("stroke", "#ef4444"); chartFill.setAttribute("fill", "rgba(239, 68, 68, 0.2)"); }
      else { profitEl.className = "chart-val neutral"; chartPath.setAttribute("stroke", "#8a819b"); chartFill.setAttribute("fill", "rgba(138, 129, 155, 0.2)"); }
    }

    function switchTab(el, tabId) {
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      el.classList.add('active'); document.getElementById(tabId).classList.add('active');
      gsap.fromTo(document.getElementById(tabId), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25 });
    }

    function switchTabDirect(tabId) { 
      closeDrawer(); 
      const navItems = document.querySelectorAll('.nav-item'); 
      const indexMap = { 'tab-events': 0, 'tab-bets': 1, 'tab-chat': 2, 'tab-cashier': 3, 'tab-profile': 4 }; 
      switchTab(navItems[indexMap[tabId]], tabId); 
    }
    
    function switchBetSubTab(el, subTabId) { 
      document.querySelectorAll('.pill-tab').forEach(t => t.classList.remove('active')); 
      el.classList.add('active'); 
      document.getElementById('active-bets').style.display = subTabId === 'active-bets' ? 'block' : 'none'; 
      document.getElementById('history-bets').style.display = subTabId === 'history-bets' ? 'block' : 'none'; 
    }
    
    const drawer = document.getElementById('drawer'); 
    const overlay = document.getElementById('overlay');
    
    document.getElementById('avatar-trigger').addEventListener('click', () => { drawer.classList.add('open'); overlay.classList.add('open'); });
    
    function closeDrawer() { drawer.classList.remove('open'); overlay.classList.remove('open'); }

    document.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
