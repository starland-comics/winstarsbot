<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WINSTARS</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0c0912;
      --card: #161120;
      --card-inner: #211a30;
      --border: rgba(255, 255, 255, 0.06);
      --accent: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.35);
      --green: #22c55e;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding-bottom: 78px;
      overflow-x: hidden;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(12, 9, 18, 0.92);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #fff;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .balance-pill {
      background: var(--card-inner);
      border: 1px solid var(--border);
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7e22ce, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
    }

    .seg-toggle {
      display: flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3px;
      flex-shrink: 0;
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 9px;
      cursor: pointer;
      transition: 0.2s;
    }

    .seg-btn.active {
      background: linear-gradient(135deg, #9333ea, #a855f7);
      color: #fff;
      box-shadow: 0 2px 12px var(--accent-glow);
    }

    .league-select-wrap {
      flex: 1;
      min-width: 0;
    }

    .league-select {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      padding: 9px 12px;
      border-radius: 12px;
      outline: none;
      text-overflow: ellipsis;
    }

    .container {
      padding: 4px 16px 20px;
    }

    .tab-view {
      display: none;
    }

    .tab-view.active {
      display: block;
    }

    /* КАРТОЧКА МАТЧА: LIVE / ПЕРЕРЫВ / МИНУТЫ НЕ ОБРЕЗАЮТСЯ */
    .match-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px 14px;
      margin-bottom: 12px;
    }

    .match-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .match-status {
      flex-shrink: 0;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--green);
    }

    .match-status.prematch {
      color: var(--muted);
      font-weight: 600;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      flex-shrink: 0;
    }

    .match-league {
      flex: 1;
      min-width: 0;
      text-align: right;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .match-body {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      cursor: pointer;
    }

    .team-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 7px;
      min-width: 0;
    }

    .team-logo-box {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card-inner);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #cbd5e1;
      overflow: hidden;
      flex-shrink: 0;
    }

    .team-logo-box img {
      width: 34px;
      height: 34px;
      object-fit: contain;
    }

    .team-name {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.25;
      max-width: 100%;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .score-center {
      font-size: 24px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 1px;
      padding: 0 6px;
    }

    .score-center.vs {
      font-size: 15px;
      color: var(--muted);
    }

    .odds-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .odd-btn {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      transition: 0.15s;
    }

    .odd-btn:active {
      background: var(--accent);
      transform: scale(0.97);
    }

    .odd-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }

    .odd-val {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: rgba(15, 11, 22, 0.96);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    }

    .nav-item {
      background: none;
      border: none;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--accent);
      font-weight: 600;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .sheet {
      width: 100%;
      max-height: 88dvh;
      background: #130e1c;
      border-top: 1px solid rgba(168, 85, 247, 0.28);
      border-radius: 22px 22px 0 0;
      padding: 14px 16px calc(22px + env(safe-area-inset-bottom));
      overflow-y: auto;
      animation: slideUp 0.2s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.18);
      margin: 0 auto 14px;
    }

    /* ЦЕНТРАЛЬНОЕ ОФОРМЛЕНИЕ МАТЧА В ОКНЕ ДОП. РЫНКОВ */
    .market-match-hero {
      background: linear-gradient(180deg, rgba(168, 85, 247, 0.14) 0%, rgba(33, 26, 48, 0.65) 100%);
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: 16px;
      padding: 14px 12px;
      margin-bottom: 16px;
      text-align: center;
    }

    .hero-league {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
      font-weight: 500;
    }

    .hero-scoreboard {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
    }

    .hero-team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }

    .hero-team .team-logo-box {
      width: 46px;
      height: 46px;
      font-size: 15px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hero-team .team-logo-box img {
      width: 38px;
      height: 38px;
    }

    .hero-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .hero-score {
      font-size: 26px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 1.5px;
    }

    .hero-time-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(34, 197, 94, 0.14);
      color: var(--green);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .hero-time-badge.prematch {
      background: rgba(148, 163, 184, 0.14);
      color: var(--muted);
    }

    .market-group {
      margin-bottom: 14px;
    }

    .market-title {
      font-size: 13px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .market-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .market-grid.cols-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .slip-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .slip-input {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      outline: none;
      margin: 10px 0;
    }

    .quick-amounts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .q-btn {
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 9px;
      padding: 7px 0;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .primary-btn {
      width: 100%;
      background: linear-gradient(135deg, #9333ea, #a855f7);
      border: none;
      border-radius: 13px;
      padding: 14px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 18px var(--accent-glow);
    }

    .bet-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .badge.active, .badge.pending { background: rgba(234, 179, 8, 0.16); color: #facc15; }
    .badge.won { background: rgba(34, 197, 94, 0.16); color: var(--green); }
    .badge.lost { background: rgba(239, 68, 68, 0.16); color: var(--red); }
    .badge.void, .badge.refund { background: rgba(148, 163, 184, 0.16); color: var(--muted); }

    .chat-box {
      height: calc(100dvh - 205px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 10px;
    }

    .chat-msg {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 13px;
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    .toast {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 90;
      background: #241b35;
      border: 1px solid var(--accent);
      color: #fff;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>

  <header class="topbar">
    <div class="brand">WINSTARS</div>
    <div class="topbar-right">
      <div class="balance-pill" onclick="switchTab('cashier')"><span id="balanceVal">0</span> ₽ ▾</div>
      <div class="avatar" id="userAvatar">W</div>
    </div>
  </header>

  <section id="tab-events" class="tab-view active">
    <div class="controls">
      <div class="seg-toggle">
        <button class="seg-btn active" id="btnLive" onclick="setMode('live')">Live</button>
        <button class="seg-btn" id="btnPrematch" onclick="setMode('prematch')">Скоро</button>
      </div>
      <div class="league-select-wrap">
        <select id="leagueSelect" class="league-select" onchange="renderMatches()">
          <option value="all">Все лиги</option>
        </select>
      </div>
    </div>
    <div class="container" id="matchesList">
      <div style="text-align:center;color:var(--muted);padding:40px 0;">Загрузка линии...</div>
    </div>
  </section>

  <section id="tab-bets" class="tab-view">
    <div class="container" style="padding-top:14px;">
      <h3 style="margin-bottom:12px;font-size:16px;">Мои купоны</h3>
      <div id="betsList"></div>
    </div>
  </section>

  <section id="tab-chat" class="tab-view">
    <div class="container" style="padding-top:12px;">
      <div id="chatMessages" class="chat-box"></div>
      <div class="chat-input-row">
        <input id="chatInput" class="slip-input" style="margin:0;" placeholder="Написать в чат..." />
        <button class="primary-btn" style="width:auto;padding:0 18px;" onclick="sendChat()">➤</button>
      </div>
    </div>
  </section>

  <section id="tab-cashier" class="tab-view">
    <div class="container" style="padding-top:14px;">
      <div class="slip-box" style="text-align:center;">
        <div style="font-size:12px;color:var(--muted);">Доступный баланс</div>
        <div style="font-size:28px;font-weight:800;margin:6px 0;"><span id="cashierBalance">0</span> ₽</div>
      </div>

      <div class="slip-box">
        <div style="font-weight:700;margin-bottom:8px;">Пополнение баланса (СБП / Карта РФ)</div>
        <input id="depAmount" type="number" class="slip-input" placeholder="Сумма от 50 ₽" value="500" />
        <div class="quick-amounts">
          <button class="q-btn" onclick="document.getElementById('depAmount').value=100">100 ₽</button>
          <button class="q-btn" onclick="document.getElementById('depAmount').value=500">500 ₽</button>
          <button class="q-btn" onclick="document.getElementById('depAmount').value=1000">1000 ₽</button>
          <button class="q-btn" onclick="document.getElementById('depAmount').value=3000">3000 ₽</button>
        </div>
        <button class="primary-btn" onclick="requestDeposit()">Пополнить в рублях</button>
      </div>

      <div class="slip-box">
        <div style="font-weight:700;margin-bottom:8px;">Вывод средств</div>
        <input id="withAmount" type="number" class="slip-input" placeholder="Сумма от 100 ₽" />
        <input id="withDetails" type="text" class="slip-input" style="font-size:14px;font-weight:500;" placeholder="Номер карты или телефон СБП (+7...)" />
        <button class="primary-btn" style="background:var(--card-inner);box-shadow:none;border:1px solid var(--border);" onclick="requestWithdraw()">Заказать выплату</button>
      </div>
    </div>
  </section>

  <section id="tab-profile" class="tab-view">
    <div class="container" style="padding-top:14px;">
      <div class="slip-box" style="display:flex;align-items:center;gap:12px;">
        <div class="avatar" style="width:48px;height:48px;font-size:18px;" id="profileAvatar">W</div>
        <div>
          <div style="font-weight:700;font-size:16px;" id="profileName">Игрок</div>
          <div style="font-size:12px;color:var(--muted);">ID: <span id="profileId">-</span></div>
        </div>
      </div>
      <div class="stat-grid">
        <div class="stat-card">
          <div style="font-size:12px;color:var(--muted);">Всего ставок</div>
          <div style="font-size:20px;font-weight:800;margin-top:4px;" id="statTotal">0</div>
        </div>
        <div class="stat-card">
          <div style="font-size:12px;color:var(--muted);">Выиграно</div>
          <div style="font-size:20px;font-weight:800;margin-top:4px;color:var(--green);" id="statWon">0</div>
        </div>
        <div class="stat-card">
          <div style="font-size:12px;color:var(--muted);">Винрейт</div>
          <div style="font-size:20px;font-weight:800;margin-top:4px;" id="statWinrate">0%</div>
        </div>
        <div class="stat-card">
          <div style="font-size:12px;color:var(--muted);">Чистый профит</div>
          <div style="font-size:20px;font-weight:800;margin-top:4px;color:var(--accent);" id="statProfit">0 ₽</div>
        </div>
      </div>
    </div>
  </section>

  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="events" onclick="switchTab('events')">
      <svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
      <span>События</span>
    </button>
    <button class="nav-item" data-tab="bets" onclick="switchTab('bets')">
      <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>Ставки</span>
    </button>
    <button class="nav-item" data-tab="chat" onclick="switchTab('chat')">
      <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span>Чат</span>
    </button>
    <button class="nav-item" data-tab="cashier" onclick="switchTab('cashier')">
      <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      <span>Касса</span>
    </button>
    <button class="nav-item" data-tab="profile" onclick="switchTab('profile')">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Профиль</span>
    </button>
  </nav>

  <div id="marketsModal" class="modal-backdrop" onclick="closeModalOnBackdrop(event, 'marketsModal')">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div id="marketsHeroContainer"></div>
      <div id="marketsListContainer"></div>
    </div>
  </div>

  <div id="betSlipModal" class="modal-backdrop" onclick="closeModalOnBackdrop(event, 'betSlipModal')">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div style="font-size:16px;font-weight:800;margin-bottom:10px;">Купон ставки</div>
      <div class="slip-box">
        <div id="slipMatchTitle" style="font-size:13px;color:var(--muted);margin-bottom:4px;"></div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span id="slipSelection" style="font-size:15px;font-weight:700;"></span>
          <span id="slipOdd" style="background:var(--accent);padding:3px 9px;border-radius:8px;font-weight:800;font-size:13px;"></span>
        </div>
      </div>
      <input id="betAmount" type="number" class="slip-input" value="100" min="10" oninput="updatePotentialWin()" />
      <div class="quick-amounts">
        <button class="q-btn" onclick="setBetAmt(50)">50 ₽</button>
        <button class="q-btn" onclick="setBetAmt(100)">100 ₽</button>
        <button class="q-btn" onclick="setBetAmt(250)">250 ₽</button>
        <button class="q-btn" onclick="setBetAmt(state.balance)">MAX</button>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:12px;">
        <span style="color:var(--muted);">Возможный выигрыш:</span>
        <span id="potentialWin" style="font-weight:800;color:var(--green);">0 ₽</span>
      </div>
      <button class="primary-btn" onclick="submitBet()">Сделать ставку</button>
    </div>
  </div>

  <script>
    const API_BASE = "https://winstarsbot.onrender.com";
    const WS_BASE = "wss://winstarsbot.onrender.com";

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.setHeaderColor("#0c0912");
      tg.setBackgroundColor("#0c0912");
    }

    const tgUser = tg?.initDataUnsafe?.user || { id: 8543184091, first_name: "геноцидов" };

    const state = {
      userId: String(tgUser.id),
      userName: tgUser.first_name || "Игрок",
      balance: 0,
      mode: "live",
      live: [],
      prematch: [],
      activeMatchId: null,
      slip: null,
      ws: null,
    };

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.display = "block";
      setTimeout(() => (el.style.display = "none"), 2600);
    }

    function getInitials(name) {
      const clean = (name || "КМ").replace(/[^а-яА-Яa-zA-Z0-9\s]/g, "").trim();
      const parts = clean.split(/\s+/);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return clean.slice(0, 2).toUpperCase() || "КМ";
    }

    function logoHtml(url, name) {
      const initials = getInitials(name);
      if (!url) return `<div class="team-logo-box">${initials}</div>`;
      return `<div class="team-logo-box"><img src="${url}" alt="" onerror="this.parentElement.textContent='${initials}'" /></div>`;
    }

    function updateBalanceUI(val) {
      state.balance = Number(val || 0);
      const formatted = Number.isInteger(state.balance) ? state.balance : state.balance.toFixed(2);
      document.getElementById("balanceVal").textContent = formatted;
      document.getElementById("cashierBalance").textContent = formatted;
    }

    function switchTab(tab) {
      document.querySelectorAll(".tab-view").forEach((el) => el.classList.remove("active"));
      document.querySelectorAll(".nav-item").forEach((el) => el.classList.remove("active"));
      document.getElementById(`tab-${tab}`).classList.add("active");
      document.querySelector(`.nav-item[data-tab="${tab}"]`).classList.add("active");

      if (tab === "bets") loadUserBets();
      if (tab === "profile") refreshProfile();
    }

    function setMode(mode) {
      state.mode = mode;
      document.getElementById("btnLive").classList.toggle("active", mode === "live");
      document.getElementById("btnPrematch").classList.toggle("active", mode === "prematch");
      updateLeagueFilter();
      renderMatches();
    }

    function updateLeagueFilter() {
      const list = state[state.mode] || [];
      const select = document.getElementById("leagueSelect");
      const current = select.value;
      const leagues = [...new Set(list.map((m) => m.league))];
      select.innerHTML = `<option value="all">Все лиги (${leagues.length})</option>` +
        leagues.map((l) => `<option value="${l}">${l}</option>`).join("");
      if (leagues.includes(current)) select.value = current;
    }

    function renderMatches() {
      const container = document.getElementById("matchesList");
      const selectedLeague = document.getElementById("leagueSelect").value;
      let list = state[state.mode] || [];
      if (selectedLeague !== "all") {
        list = list.filter((m) => m.league === selectedLeague);
      }

      if (!list.length) {
        container.innerHTML = `<div style="text-align:center;color:var(--muted);padding:40px 0;">Нет активных событий в выбранной категории</div>`;
        return;
      }

      container.innerHTML = list.map((m) => {
        const statusHtml = m.is_live
          ? `<div class="match-status"><span class="live-dot"></span><span>${m.time_label}</span></div>`
          : `<div class="match-status prematch"><span>${m.time_label}</span></div>`;

        const scoreHtml = m.is_live
          ? `<div class="score-center">${m.score1}:${m.score2}</div>`
          : `<div class="score-center vs">VS</div>`;

        return `
          <div class="match-card">
            <div class="match-card-header">
              ${statusHtml}
              <div class="match-league">${m.league}</div>
            </div>
            <div class="match-body" onclick="openMarkets('${m.id}')">
              <div class="team-col">
                ${logoHtml(m.logo1, m.team1)}
                <div class="team-name">${m.team1}</div>
              </div>
              ${scoreHtml}
              <div class="team-col">
                ${logoHtml(m.logo2, m.team2)}
                <div class="team-name">${m.team2}</div>
              </div>
            </div>
            <div class="odds-row">
              <button class="odd-btn" onclick="openBetSlip('${m.id}', 'П1', ${m.odds.P1})">
                <span class="odd-label">П1</span>
                <span class="odd-val">${m.odds.P1}</span>
              </button>
              <button class="odd-btn" onclick="openBetSlip('${m.id}', 'X', ${m.odds.X || 3.25})">
                <span class="odd-label">X</span>
                <span class="odd-val">${m.odds.X || 3.25}</span>
              </button>
              <button class="odd-btn" onclick="openBetSlip('${m.id}', 'П2', ${m.odds.P2})">
                <span class="odd-label">П2</span>
                <span class="odd-val">${m.odds.P2}</span>
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderMarketsHero(m) {
      const scoreText = m.is_live ? `${m.score1} : ${m.score2}` : "VS";
      const badgeClass = m.is_live ? "hero-time-badge" : "hero-time-badge prematch";
      const dot = m.is_live ? `<span class="live-dot"></span>` : "";

      document.getElementById("marketsHeroContainer").innerHTML = `
        <div class="market-match-hero">
          <div class="hero-league">${m.league}</div>
          <div class="hero-scoreboard">
            <div class="hero-team">
              ${logoHtml(m.logo1, m.team1)}
              <span>${m.team1}</span>
            </div>
            <div class="hero-center">
              <div class="hero-score">${scoreText}</div>
              <div class="${badgeClass}">${dot}<span>${m.time_label}</span></div>
            </div>
            <div class="hero-team">
              ${logoHtml(m.logo2, m.team2)}
              <span>${m.team2}</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderMarketsBody(m) {
      const groups = m.markets || [];
      document.getElementById("marketsListContainer").innerHTML = groups.map((g) => {
        const colsClass = g.outcomes.length === 3 ? "market-grid cols-3" : "market-grid";
        return `
          <div class="market-group">
            <div class="market-title">${g.title}</div>
            <div class="${colsClass}">
              ${g.outcomes.map((o) => `
                <button class="odd-btn" onclick="openBetSlip('${m.id}', '${o.label}', ${o.odd})">
                  <span class="odd-label">${o.label}</span>
                  <span class="odd-val">${o.odd}</span>
                </button>
              `).join("")}
            </div>
          </div>
        `;
      }).join("");
    }

    async function openMarkets(matchId) {
      const all = [...state.live, ...state.prematch];
      const match = all.find((x) => x.id === matchId);
      if (!match) return;

      state.activeMatchId = matchId;
      renderMarketsHero(match);
      renderMarketsBody(match);
      document.getElementById("marketsModal").classList.add("open");

      try {
        const res = await fetch(`${API_BASE}/api/match/${matchId}/markets`);
        if (res.ok && state.activeMatchId === matchId) {
          const fresh = await res.json();
          renderMarketsHero(fresh);
          renderMarketsBody(fresh);
        }
      } catch (e) {}
    }

    function openBetSlip(matchId, selection, odd) {
      if (!odd || odd <= 1) return;
      const all = [...state.live, ...state.prematch];
      const m = all.find((x) => x.id === matchId);
      if (!m) return;

      state.slip = {
        matchId,
        title: `${m.team1} - ${m.team2}`,
        selection,
        odd: Number(odd),
      };

      document.getElementById("slipMatchTitle").textContent = state.slip.title;
      document.getElementById("slipSelection").textContent = selection;
      document.getElementById("slipOdd").textContent = state.slip.odd.toFixed(2);
      updatePotentialWin();
      document.getElementById("betSlipModal").classList.add("open");
    }

    function setBetAmt(val) {
      document.getElementById("betAmount").value = Math.max(10, Math.floor(val || 10));
      updatePotentialWin();
    }

    function updatePotentialWin() {
      if (!state.slip) return;
      const amt = Number(document.getElementById("betAmount").value || 0);
      const win = (amt * state.slip.odd).toFixed(2);
      document.getElementById("potentialWin").textContent = `${win} ₽`;
    }

    async function submitBet() {
      if (!state.slip) return;
      const amount = Number(document.getElementById("betAmount").value || 0);
      try {
        const res = await fetch(`${API_BASE}/api/bet`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_id: state.userId,
            match_id: state.slip.matchId,
            selection: state.slip.selection,
            odd: state.slip.odd,
            amount,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          showToast(data.detail || "Ошибка ставки");
          return;
        }
        updateBalanceUI(data.balance);
        document.getElementById("betSlipModal").classList.remove("open");
        showToast("Ставка принята!");
      } catch (e) {
        showToast("Ошибка соединения с сервером");
      }
    }

    async function loadUserBets() {
      const box = document.getElementById("betsList");
      box.innerHTML = `<div style="color:var(--muted);text-align:center;padding:24px;">Загрузка...</div>`;
      const res = await fetch(`${API_BASE}/api/bets/${state.userId}`);
      const bets = await res.json();
      if (!bets.length) {
        box.innerHTML = `<div style="color:var(--muted);text-align:center;padding:30px;">У вас пока нет ставок</div>`;
        return;
      }
      const labels = {
        active: "В игре",
        pending: "В игре",
        won: "Выигрыш",
        lost: "Проигрыш",
        void: "Возврат",
        refund: "Возврат",
      };
      box.innerHTML = bets.map((b) => {
        const ev = Array.isArray(b.events) && b.events.length ? b.events[0] : {};
        const title = b.match_title || ev.match_title || ev.match || "Событие";
        const league = b.league || ev.league || "";
        const sel = b.selection || b.outcome || ev.outcome || "Исход";
        const odd = b.odd || b.total_coefficient || b.coefficient || ev.coefficient || "1.00";
        const st = b.status || "active";
        return `
          <div class="bet-item">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
              <span style="font-size:12px;color:var(--muted);">${league}</span>
              <span class="badge ${st}">${labels[st] || st}</span>
            </div>
            <div style="font-weight:700;font-size:14px;margin-bottom:4px;">${title} ${b.final_score ? `(${b.final_score})` : ""}</div>
            <div style="display:flex;justify-content:space-between;font-size:13px;">
              <span>${sel} @ <b>${odd}</b></span>
              <span>Ставка: <b>${b.amount} ₽</b></span>
            </div>
          </div>
        `;
      }).join("");
    }

    async function refreshProfile() {
      const res = await fetch(`${API_BASE}/api/init/${state.userId}?name=${encodeURIComponent(state.userName)}`);
      const data = await res.json();
      const u = data.user || {};
      updateBalanceUI(u.balance);
      const total = u.total_bets || 0;
      const won = u.won_bets || 0;
      const wr = total ? Math.round((won / total) * 100) : 0;
      document.getElementById("statTotal").textContent = total;
      document.getElementById("statWon").textContent = won;
      document.getElementById("statWinrate").textContent = `${wr}%`;
      document.getElementById("statProfit").textContent = `${Number(u.net_profit || 0).toFixed(0)} ₽`;
    }

    async function requestDeposit() {
      const amount = Number(document.getElementById("depAmount").value || 0);
      const res = await fetch(`${API_BASE}/api/cashier/deposit`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: state.userId, amount }),
      });
      const data = await res.json();
      showToast(data.message || data.detail || "Запрос создан");
    }

    async function requestWithdraw() {
      const amount = Number(document.getElementById("withAmount").value || 0);
      const details = document.getElementById("withDetails").value.trim();
      if (!details) return showToast("Укажите реквизиты");
      const res = await fetch(`${API_BASE}/api/cashier/withdraw`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: state.userId, amount, details }),
      });
      const data = await res.json();
      if (!res.ok) return showToast(data.detail || "Ошибка вывода");
      updateBalanceUI(data.balance);
      showToast("Заявка на вывод отправлена");
    }

    function appendChatMsg(box, m) {
      const u = m.user || m.username || m.first_name || m.name || "Игрок";
      const t = m.time || "";
      const txt = m.text || m.message || "";
      box.innerHTML += `<div class="chat-msg"><b>${u}</b> <span style="color:var(--muted);font-size:11px;">${t}</span><div style="margin-top:3px;">${txt}</div></div>`;
    }

    function initChat() {
      state.ws = new WebSocket(`${WS_BASE}/ws/chat`);
      state.ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        const box = document.getElementById("chatMessages");
        if (data.type === "history") {
          box.innerHTML = "";
          (data.messages || []).forEach((m) => appendChatMsg(box, m));
        } else if (data.type === "message") {
          appendChatMsg(box, data.message);
        }
        box.scrollTop = box.scrollHeight;
      };
    }

    function sendChat() {
      const inp = document.getElementById("chatInput");
      const text = inp.value.trim();
      if (!text || !state.ws || state.ws.readyState !== 1) return;
      state.ws.send(JSON.stringify({ user: state.userName, text }));
      inp.value = "";
    }

    function closeModalOnBackdrop(e, id) {
      if (e.target.id === id) {
        document.getElementById(id).classList.remove("open");
        if (id === "marketsModal") state.activeMatchId = null;
      }
    }

    async function boot() {
      document.getElementById("profileName").textContent = state.userName;
      document.getElementById("profileId").textContent = state.userId;
      const letter = state.userName[0]?.toUpperCase() || "W";
      if (tgUser.photo_url) {
        document.getElementById("userAvatar").innerHTML = `<img src="${tgUser.photo_url}" />`;
        document.getElementById("profileAvatar").innerHTML = `<img src="${tgUser.photo_url}" />`;
      } else {
        document.getElementById("userAvatar").textContent = letter;
        document.getElementById("profileAvatar").textContent = letter;
      }

      const res = await fetch(`${API_BASE}/api/init/${state.userId}?name=${encodeURIComponent(state.userName)}`);
      const data = await res.json();
      updateBalanceUI(data.user?.balance || 0);
      state.live = data.live || [];
      state.prematch = data.prematch || [];
      updateLeagueFilter();
      renderMatches();
      initChat();

      setInterval(async () => {
        try {
          const r = await fetch(`${API_BASE}/api/matches`);
          const d = await r.json();
          state.live = d.live || [];
          state.prematch = d.prematch || [];
          updateLeagueFilter();
          renderMatches();

          if (state.activeMatchId) {
            const active = [...state.live, ...state.prematch].find((x) => x.id === state.activeMatchId);
            if (active) renderMarketsHero(active);
          }
        } catch (e) {}
      }, 10000);
    }

    boot();
  </script>
</body>
</html>
